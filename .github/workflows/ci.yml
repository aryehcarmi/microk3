name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            torch_spec: "torch==2.4.1"
          - python-version: "3.13"
            torch_spec: "torch>=2.4.1,<3"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install "${{ matrix.torch_spec }}" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev]"

      - name: Check
        run: |
          python -m pip check
          python -m ruff check .
          python -m ruff format --check .
          python -m pytest

      - name: Build distributions
        run: python -m build

      - name: Verify installed wheel
        run: |
          python -m pip uninstall -y microk3
          python -m pip install --no-deps dist/*.whl
          cd /tmp
          python -c "import microk3; print(microk3.__file__)"
          microk3 --help
